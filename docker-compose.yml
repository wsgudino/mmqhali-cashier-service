services:
  postgres:
    image: postgres:17-alpine
    container_name: mmqhali-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # Se mapea al puerto 5435 del host para no colisionar con otros servicios PostgreSQL locales
      - "${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

volumes:
  postgres_data:
